name: Check LuCI package

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['luci-app-byedpi/**', 'scripts/**', '.github/workflows/**']
  pull_request:
    paths: ['luci-app-byedpi/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-packages.yml
